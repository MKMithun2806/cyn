[package]
name = "cyn"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-2.0-or-later"
description = "A lightweight CLI vulnerability scanner built on OpenVAS"
repository = "https://github.com/MKMithun2806/cyn"
homepage = "https://github.com/MKMithun2806/cyn"
keywords = ["security", "scanner", "openvas", "vulnerability", "cli"]
categories = ["command-line-utilities", "parser-implementations"]

[dependencies]
scannerlib = { path = "openvas/rust" }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
