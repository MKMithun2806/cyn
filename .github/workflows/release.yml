name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Check version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG not found — will release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
            archives: native
            platform: linux/amd64
            cache-platform: linux-amd64
            qemu: false
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
            archives: musl
            platform: linux/amd64
            cache-platform: linux-amd64
            qemu: false
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
            archives: musl
            platform: linux/arm64
            cache-platform: linux-arm64
            qemu: true
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache static archives (krb5/libpcap)
        id: cache-archives
        uses: actions/cache@v4
        with:
          path: openvas/rust/crates/nasl-c-lib/build-cache
          key: archives-${{ matrix.archives }}-${{ matrix.cache-platform }}-${{ hashFiles('openvas/.docker/prod.Dockerfile', 'openvas/rust/crates/nasl-c-lib/Makefile', 'openvas/.docker/vendor/**', '.github/workflows/ci.yml', '.github/workflows/release.yml') }}

      - name: Set up QEMU (arm64 archive build)
        if: matrix.qemu && steps.cache-archives.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build static archives
        if: steps.cache-archives.outputs.cache-hit != 'true'
        run: |
          set -eu
          ARCHIVES_DIR=openvas/rust/crates/nasl-c-lib/build-cache/archives
          rm -rf "$ARCHIVES_DIR"
          mkdir -p "$ARCHIVES_DIR"
          case "${{ matrix.archives }}" in
          native)
            make -C openvas/rust/crates/nasl-c-lib
            ;;
          musl)
            cat > /tmp/musl-archives.Dockerfile <<'DOCKERFILE_EOF'
          FROM alpine:3.20
          RUN apk add --no-cache build-base bison flex perl linux-headers
          COPY vendor/krb5-1.22.2 /tmp/krb5-1.22.2
          COPY vendor/libpcap-1.10.6 /tmp/libpcap-1.10.6
          WORKDIR /tmp/krb5-1.22.2/src
          RUN ./configure --prefix=/opt/krb5-static --enable-static --disable-shared \
                --without-system-verto --without-libedit --disable-rpath \
            && make -C util/support -j"$(nproc 2>/dev/null || echo 2)" \
            && make -C util/et -j"$(nproc 2>/dev/null || echo 2)" \
            && make -C util/profile -j"$(nproc 2>/dev/null || echo 2)" \
            && make -C include -j"$(nproc 2>/dev/null || echo 2)" \
            && make -C lib/crypto -j"$(nproc 2>/dev/null || echo 2)" \
            && make -C lib/krb5 -j"$(nproc 2>/dev/null || echo 2)" \
            && make -C lib/gssapi -j"$(nproc 2>/dev/null || echo 2)" \
            && make install-mkdirs \
            && make -C util/support install \
            && make -C util/et install \
            && make -C util/profile install \
            && make -C include install \
            && make -C lib/crypto install \
            && make -C lib/krb5 install \
            && make -C lib/gssapi install \
            && test -f /opt/krb5-static/lib/libgssapi_krb5.a \
            && test -f /opt/krb5-static/lib/libkrb5.a \
            && test -f /opt/krb5-static/lib/libk5crypto.a \
            && test -f /opt/krb5-static/lib/libcom_err.a \
            && test -f /opt/krb5-static/lib/libkrb5support.a
          WORKDIR /tmp/libpcap-1.10.6
          RUN ./configure --prefix=/opt/libpcap-static --disable-shared --disable-dbus \
            && make -j"$(nproc 2>/dev/null || echo 2)" \
            && make install \
            && test -f /opt/libpcap-static/lib/libpcap.a
          RUN mkdir -p /archives/include \
            && cp /opt/libpcap-static/lib/libpcap.a /archives/ \
            && cp /opt/krb5-static/lib/libgssapi_krb5.a \
                  /opt/krb5-static/lib/libkrb5.a \
                  /opt/krb5-static/lib/libk5crypto.a \
                  /opt/krb5-static/lib/libcom_err.a \
                  /opt/krb5-static/lib/libkrb5support.a \
                  /archives/ \
            && cp -r /opt/libpcap-static/include/* /archives/include/ \
            && cp -r /opt/krb5-static/include/* /archives/include/ \
            && test -f /archives/include/krb5.h \
            && test -f /archives/include/gssapi/gssapi.h \
            && test -f /archives/include/pcap.h
          DOCKERFILE_EOF
            docker build \
              --platform ${{ matrix.platform }} \
              -f /tmp/musl-archives.Dockerfile \
              -t cyn-musl-archives \
              openvas/.docker
            cid=$(docker create cyn-musl-archives)
            docker cp "$cid:/archives/." "$ARCHIVES_DIR/"
            docker rm "$cid"
            docker rmi -f cyn-musl-archives
            ;;
          *)
            echo "unknown archives flavor: ${{ matrix.archives }}" >&2
            exit 1
            ;;
          esac
          echo "Archives ready:"
          ls -la "$ARCHIVES_DIR"

      - name: Install capnp in cross container
        if: matrix.use-cross
        run: |
          set -eu
          IMAGE=ghcr.io/cross-rs/${{ matrix.target }}:main
          mkdir -p /tmp/capnp-patch
          printf 'FROM %s\nRUN apt-get update && apt-get install -y --no-install-recommends capnproto && rm -rf /var/lib/apt/lists/*\n' "$IMAGE" > /tmp/capnp-patch/Dockerfile
          docker build -t "$IMAGE" /tmp/capnp-patch
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'capnp --version'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross-compilation tools
        if: matrix.use-cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            capnproto \
            libpcap-dev \
            libsnmp-dev \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            clang \
            libssh2-1-dev \
            zlib1g-dev
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Install system dependencies (Linux native)
        if: "!matrix.use-cross && runner.os == 'Linux'"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            capnproto \
            libpcap-dev \
            libsnmp-dev \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            clang \
            libssh2-1-dev \
            zlib1g-dev \
            musl-tools

      - name: Verify build flags
        shell: bash
        run: |
          echo "Checking .cargo/config.toml..."
          cat .cargo/config.toml
          if ! grep -q "target-feature=-crt-static" .cargo/config.toml; then
            echo "WARNING: crt-static not disabled"
          fi

      - name: Build with cross
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build with cargo (native)
        if: "!matrix.use-cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: runner.os == 'Linux' && !matrix.use-cross
        run: strip target/${{ matrix.target }}/release/cyn || true

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/cyn"
          VERSION="${{ needs.version-check.outputs.version }}"
          ARCHIVE_NAME="cyn-${VERSION}-${{ matrix.target }}"

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar czf "${ARCHIVE_NAME}.tar.gz" -C "$(dirname $BINARY)" "$(basename $BINARY)"
            ASSET="${ARCHIVE_NAME}.tar.gz"
          else
            zip "${ARCHIVE_NAME}.zip" "$BINARY"
            ASSET="${ARCHIVE_NAME}.zip"
          fi
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

          if command -v sha256sum &> /dev/null; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyn-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    name: Create release
    needs: [version-check, build]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          name: v${{ needs.version-check.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
