name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache static archives (krb5/libpcap)
        id: cache-archives
        uses: actions/cache@v4
        with:
          path: openvas/rust/crates/nasl-c-lib/build-cache
          key: archives-native-linux-amd64-${{ hashFiles('openvas/.docker/prod.Dockerfile', 'openvas/rust/crates/nasl-c-lib/Makefile', 'openvas/.docker/vendor/**', '.github/workflows/ci.yml', '.github/workflows/release.yml') }}
      - name: Build static archives
        if: steps.cache-archives.outputs.cache-hit != 'true'
        run: make -C openvas/rust/crates/nasl-c-lib
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            capnproto \
            libpcap-dev \
            libsnmp-dev \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            clang \
            libssh2-1-dev \
            zlib1g-dev
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache static archives (krb5/libpcap)
        id: cache-archives
        uses: actions/cache@v4
        with:
          path: openvas/rust/crates/nasl-c-lib/build-cache
          key: archives-native-linux-amd64-${{ hashFiles('openvas/.docker/prod.Dockerfile', 'openvas/rust/crates/nasl-c-lib/Makefile', 'openvas/.docker/vendor/**', '.github/workflows/ci.yml', '.github/workflows/release.yml') }}
      - name: Build static archives
        if: steps.cache-archives.outputs.cache-hit != 'true'
        run: make -C openvas/rust/crates/nasl-c-lib
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            capnproto \
            libpcap-dev \
            libsnmp-dev \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            clang \
            libssh2-1-dev \
            zlib1g-dev
      - run: cargo test --all-targets

  build-flags:
    name: Verify build flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .cargo/config.toml exists
        run: test -f .cargo/config.toml
      - name: Verify crt-static is disabled
        run: |
          if grep -q "target-feature=-crt-static" .cargo/config.toml; then
            echo "OK: crt-static disabled (required for bindgen/libclang)"
          else
            echo "FAIL: .cargo/config.toml missing target-feature=-crt-static"
            exit 1
          fi
